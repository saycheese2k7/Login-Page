<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>
    <div class="container1">
        <div class="logo-container">
            <img src="images/odin-lined.png" class="logo">
            <h1>ODIN</h1>
        </div>
    </div>
    <div class="container2">
        <div>
            <h2>Create an Account</h2>
            <p>To get the most out of Odin, create an account. It's free and easy.</p>
        </div>

        <div class="signup-form">
            <form action="submit" method="post" id="createaccform">
                <div>
                <label for="fname">First Name</label>
                <input type="text" id="name" name="name" required>
                </div>

                <div>
                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lname">
                </div>

                <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                </div>

                <div>  
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required>
                </div>
                
                <div>
                <label for="pword">Password</label>
                <input type="password" id="pword" name="pword" required>
                </div>

                <div>
                <label for="cpword">Confirm Password</label>
                <input type="password" id="cpword" name="cpword" required>
                </div>

            </form>
        </div>

        <div>
            <input class="btn" type="submit" value="Create Account" form="createaccform">
        </div>

        <div>
            <p>Already have an account? <a href="/login">Login</a></p> 
        </div>
    </div>
</body>
</html>
